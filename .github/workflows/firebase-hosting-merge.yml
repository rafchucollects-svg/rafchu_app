name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint
      - run: npm test && npm --prefix functions test
      - run: npx --yes --package firebase-tools@15.29.0 firebase emulators:exec --only firestore --project demo-rafchu-review 'node --test tests/firestore.rules.test.mjs'
      - run: npm run build
      - name: Deploy Firestore rules before Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAFCHU_TCG_APP }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, unlinkSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const credentialsPath = join(process.env.RUNNER_TEMP, 'rafchu-rules-deploy.json');
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if (credentials.project_id !== 'rafchu-tcg-app') throw new Error('Unexpected Firebase deployment project');
          writeFileSync(credentialsPath, JSON.stringify(credentials), { mode: 0o600 });
          try {
            const result = spawnSync('npx', ['--yes', '--package', 'firebase-tools@15.29.0', 'firebase', 'deploy', '--only', 'firestore:rules', '--project', 'rafchu-tcg-app', '--non-interactive'], {
              stdio: 'inherit',
              env: { ...process.env, GOOGLE_APPLICATION_CREDENTIALS: credentialsPath },
            });
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          } finally {
            unlinkSync(credentialsPath);
          }
          NODE
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAFCHU_TCG_APP }}
          channelId: live
          projectId: rafchu-tcg-app
