<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rafchu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafchu Marketplace</title>
  </head>
  <body>
    <script>
      // Firebase's default OAuth client already trusts the firebaseapp.com
      // callback. Keep production on that canonical Hosting domain so popup
      // and redirect sign-in both remain first-party across modern browsers.
      if (window.location.hostname === "rafchu-tcg-app.web.app") {
        window.location.replace(
          `https://rafchu-tcg-app.firebaseapp.com${window.location.pathname}${window.location.search}${window.location.hash}`
        );
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
